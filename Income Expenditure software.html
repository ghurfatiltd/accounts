<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceHub - Professional Management Accounts System</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- jsPDF & autoTable for Professional PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <!-- Tailwind Config for Custom Styling -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                            900: '#0c4a6e',
                        },
                        income: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        },
                        expense: {
                            50: '#fef2f2',
                            100: '#fee2e2',
                            500: '#ef4444',
                            600: '#dc2626',
                            700: '#b91c1c',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbars & smooth transitions */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        
        /* Print styles for high-quality report generation */
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .print-container { width: 100% !important; margin: 0 !important; padding: 0 !important; }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans antialiased min-h-screen flex flex-col transition-colors duration-200">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- MAIN APP STRUCTURE -->
    <div id="app" class="flex h-screen overflow-hidden">

        <!-- SIDEBAR NAVIGATION -->
        <aside id="sidebar" class="no-print w-64 bg-slate-900 text-slate-300 flex flex-col justify-between transition-all duration-300 z-30 shrink-0">
            <div>
                <!-- App Header / Logo -->
                <div class="h-16 flex items-center justify-between px-6 bg-slate-950 border-b border-slate-800">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-xl bg-brand-500 flex items-center justify-center text-white shadow-lg shadow-brand-500/30">
                            <i data-lucide="wallet" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <span class="font-bold text-white tracking-wide text-lg block leading-tight">FinanceHub</span>
                            <span class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Management Accounts</span>
                        </div>
                    </div>
                </div>

                <!-- Company Selector / Info Header -->
                <div class="p-4 border-b border-slate-800/60 bg-slate-900/50">
                    <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Entity</div>
                    <div id="sidebar-company-name" class="text-sm font-medium text-white truncate">Acme Enterprises Ltd</div>
                    <div class="text-xs text-slate-400 mt-0.5 flex items-center gap-1">
                        <span id="sidebar-currency-badge" class="px-1.5 py-0.5 bg-slate-800 rounded font-mono text-[10px] text-brand-500 font-bold">GBP (£)</span>
                        <span class="text-slate-400">• FY: Apr-Mar</span>
                    </div>
                </div>

                <!-- Main Nav Links -->
                <nav class="p-3 space-y-1">
                    <button onclick="navigate('dashboard')" id="nav-dashboard" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors text-white bg-brand-600/20 text-brand-500">
                        <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                        Dashboard
                    </button>
                    <button onclick="navigate('transactions')" id="nav-transactions" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors hover:bg-slate-800 hover:text-white text-slate-400">
                        <i data-lucide="receipt" class="w-4 h-4"></i>
                        Transactions
                    </button>
                    <button onclick="navigate('reports')" id="nav-reports" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors hover:bg-slate-800 hover:text-white text-slate-400">
                        <i data-lucide="file-text" class="w-4 h-4"></i>
                        Reports & Accounts
                    </button>
                    <button onclick="navigate('analysis')" id="nav-analysis" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors hover:bg-slate-800 hover:text-white text-slate-400">
                        <i data-lucide="line-chart" class="w-4 h-4"></i>
                        Insights & Trends
                    </button>
                    <button onclick="navigate('categories')" id="nav-categories" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors hover:bg-slate-800 hover:text-white text-slate-400">
                        <i data-lucide="tags" class="w-4 h-4"></i>
                        Categories
                    </button>
                    <button onclick="navigate('audit')" id="nav-audit" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors hover:bg-slate-800 hover:text-white text-slate-400">
                        <i data-lucide="shield-check" class="w-4 h-4"></i>
                        Audit Trail
                    </button>
                    <button onclick="navigate('settings')" id="nav-settings" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors hover:bg-slate-800 hover:text-white text-slate-400">
                        <i data-lucide="settings" class="w-4 h-4"></i>
                        Settings
                    </button>
                </nav>
            </div>

            <!-- Sidebar Footer Controls -->
            <div class="p-3 border-t border-slate-800 space-y-2">
                <button onclick="clearAllData()" class="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-lg text-xs font-semibold bg-red-950/40 border border-red-800/50 hover:bg-red-900/50 text-red-300 transition-colors">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    Clear All Data
                </button>
                <div class="flex items-center justify-between px-2 py-1 text-xs text-slate-400">
                    <span id="user-role-badge" class="px-2 py-0.5 rounded bg-brand-500/20 text-brand-500 font-medium">Finance Admin</span>
                    <button onclick="toggleDarkMode()" class="p-1 hover:bg-slate-800 rounded text-slate-400 hover:text-slate-200">
                        <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
                        <i data-lucide="sun" class="w-4 h-4 hidden dark:inline"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT CONTAINER -->
        <main class="flex-1 flex flex-col h-full overflow-y-auto bg-slate-50 dark:bg-slate-900 transition-colors">
            
            <!-- TOP BAR HEADER -->
            <header class="no-print h-16 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 px-6 flex items-center justify-between sticky top-0 z-20 shrink-0">
                <div class="flex items-center gap-4">
                    <button onclick="toggleSidebar()" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 md:hidden">
                        <i data-lucide="menu" class="w-5 h-5"></i>
                    </button>
                    <!-- Global Search Bar -->
                    <div class="relative w-64 md:w-80">
                        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="global-search" onkeyup="handleGlobalSearch(event)" placeholder="Search transactions, reference, category..." class="w-full pl-9 pr-4 py-1.5 bg-slate-100 dark:bg-slate-800 border-none rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:bg-white dark:focus:bg-slate-900 transition-all text-slate-800 dark:text-slate-200">
                    </div>
                </div>

                <!-- Action Toolbar Header Controls -->
                <div class="flex items-center gap-3">
                    <!-- Period Selector Dropdown -->
                    <div class="flex items-center bg-slate-100 dark:bg-slate-800 p-1 rounded-lg border border-slate-200 dark:border-slate-700">
                        <i data-lucide="calendar" class="w-4 h-4 text-slate-500 ml-2 mr-1"></i>
                        <select id="global-period-select" onchange="changeGlobalPeriod(this.value)" class="bg-transparent text-sm font-semibold text-slate-700 dark:text-slate-200 focus:outline-none cursor-pointer pr-2">
                            <option value="this_month">This Month</option>
                            <option value="prev_month">Previous Month</option>
                            <option value="this_quarter">This Quarter</option>
                            <option value="this_year">This Year (2026)</option>
                            <option value="prev_year">Previous Year (2025)</option>
                            <option value="financial_year">Financial Year (2026/27)</option>
                            <option value="all">All Time</option>
                        </select>
                    </div>

                    <!-- Quick Transaction Entry Buttons -->
                    <button onclick="openTransactionModal('income')" class="flex items-center gap-1.5 px-3 py-2 bg-income-600 hover:bg-income-700 text-white rounded-lg font-semibold text-sm shadow-sm shadow-income-600/30 transition-all hover:scale-[1.02] active:scale-[0.98]">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i>
                        <span>Add Income</span>
                    </button>
                    <button onclick="openTransactionModal('expenditure')" class="flex items-center gap-1.5 px-3 py-2 bg-expense-600 hover:bg-expense-700 text-white rounded-lg font-semibold text-sm shadow-sm shadow-expense-600/30 transition-all hover:scale-[1.02] active:scale-[0.98]">
                        <i data-lucide="minus-circle" class="w-4 h-4"></i>
                        <span>Add Expenditure</span>
                    </button>
                </div>
            </header>

            <!-- DYNAMIC VIEW CONTAINER -->
            <div id="main-view" class="p-6 max-w-7xl mx-auto w-full space-y-6">
                <!-- Content dynamically injected here via JS -->
            </div>
        </main>
    </div>

    <!-- TRANSACTION MODAL (Multi-Category Income/Expenditure Form) -->
    <div id="transaction-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200 p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden transform scale-95 transition-transform duration-200 border border-slate-200 dark:border-slate-700">
            <div id="modal-header-bg" class="px-6 py-4 bg-slate-900 text-white flex justify-between items-center shrink-0">
                <div class="flex items-center gap-2">
                    <div id="modal-type-icon" class="p-1.5 rounded-lg bg-white/10"></div>
                    <h3 id="modal-title" class="font-bold text-lg">Add Transaction</h3>
                </div>
                <button onclick="closeTransactionModal()" class="text-slate-400 hover:text-white p-1 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="transaction-form" onsubmit="saveTransaction(event)" class="p-6 space-y-5 overflow-y-auto flex-1">
                <input type="hidden" id="tx-id">
                <input type="hidden" id="tx-type">

                <!-- Time Scope Radio Selector: Option A vs Option B -->
                <div class="bg-slate-50 dark:bg-slate-900/70 p-3.5 rounded-xl border border-slate-200 dark:border-slate-700/80">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">Entry Timing / Scope *</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="flex items-center gap-2.5 p-2.5 rounded-lg border bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 cursor-pointer hover:border-brand-500 transition-colors">
                            <input type="radio" name="tx-entry-scope" value="onetime" checked onchange="handleScopeChange()" class="text-brand-600 focus:ring-brand-500">
                            <div>
                                <div class="text-xs font-bold text-slate-800 dark:text-slate-100">Option A: One-Time / Current Day</div>
                                <div class="text-[10px] text-slate-500 dark:text-slate-400">Specific transaction date</div>
                            </div>
                        </label>
                        <label class="flex items-center gap-2.5 p-2.5 rounded-lg border bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 cursor-pointer hover:border-brand-500 transition-colors">
                            <input type="radio" name="tx-entry-scope" value="monthly" onchange="handleScopeChange()" class="text-brand-600 focus:ring-brand-500">
                            <div>
                                <div class="text-xs font-bold text-slate-800 dark:text-slate-100">Option B: Whole Month / Monthly</div>
                                <div class="text-[10px] text-slate-500 dark:text-slate-400">Applies to entire selected month</div>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Date Inputs Container -->
                <div id="scope-onetime-container">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Date *</label>
                    <input type="date" id="tx-date" required class="w-full px-3 py-2 border rounded-lg dark:bg-slate-900 dark:border-slate-700 text-sm focus:ring-2 focus:ring-brand-500">
                </div>

                <div id="scope-monthly-container" class="grid grid-cols-2 gap-4 hidden">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Month *</label>
                        <select id="tx-month" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-900 dark:border-slate-700 text-sm focus:ring-2 focus:ring-brand-500">
                            <option value="01">January</option>
                            <option value="02">February</option>
                            <option value="03">March</option>
                            <option value="04">April</option>
                            <option value="05">May</option>
                            <option value="06">June</option>
                            <option value="07">July</option>
                            <option value="08">August</option>
                            <option value="09" selected>September</option>
                            <option value="10">October</option>
                            <option value="11">November</option>
                            <option value="12">December</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Year *</label>
                        <input type="number" id="tx-year" value="2026" min="2000" max="2100" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-900 dark:border-slate-700 text-sm font-semibold focus:ring-2 focus:ring-brand-500">
                    </div>
                </div>

                <!-- MULTI-CATEGORY SELECTION UI -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300">
                            Select Categories & Enter Amounts *
                        </label>
                        <span class="text-[11px] text-slate-500">Tick one or multiple existing categories</span>
                    </div>

                    <!-- Category checkboxes list -->
                    <div id="multi-category-selection-container" class="max-h-48 overflow-y-auto p-3 border rounded-xl dark:bg-slate-900 dark:border-slate-700 space-y-2 bg-slate-50/50">
                        <!-- Populated dynamically -->
                    </div>

                    <!-- Category allocations & inputs -->
                    <div class="mt-3 space-y-2">
                        <div class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                            Allocated Category Amounts
                        </div>
                        <div id="category-allocations-list" class="space-y-2">
                            <!-- Populated dynamically upon selecting categories -->
                        </div>
                    </div>

                    <!-- Entry Calculated Total -->
                    <div class="mt-4 p-3 rounded-xl bg-slate-100 dark:bg-slate-900/90 border border-slate-200 dark:border-slate-700 flex justify-between items-center">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300">Total Entry Amount:</span>
                        <span id="tx-total-display" class="text-lg font-black font-mono text-brand-600 dark:text-brand-400">£0.00</span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label id="lbl-source-supplier" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Customer / Source</label>
                        <input type="text" id="tx-source" placeholder="Client or Supplier name" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-900 dark:border-slate-700 text-sm focus:ring-2 focus:ring-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Payment Method</label>
                        <select id="tx-payment-method" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-900 dark:border-slate-700 text-sm focus:ring-2 focus:ring-brand-500">
                            <option value="Bank Transfer">Bank Transfer</option>
                            <option value="Credit Card">Credit Card</option>
                            <option value="Debit Card">Debit Card</option>
                            <option value="Direct Debit">Direct Debit</option>
                            <option value="Cash">Cash</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Reference / Invoice #</label>
                        <input type="text" id="tx-reference" placeholder="INV-2026-001" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-900 dark:border-slate-700 text-sm focus:ring-2 focus:ring-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Attachment Reference</label>
                        <input type="text" id="tx-attachment" placeholder="Receipt_#482.pdf" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-900 dark:border-slate-700 text-sm focus:ring-2 focus:ring-brand-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Description / Notes</label>
                    <textarea id="tx-description" rows="2" placeholder="Optional context or memo..." class="w-full px-3 py-2 border rounded-lg dark:bg-slate-900 dark:border-slate-700 text-sm focus:ring-2 focus:ring-brand-500"></textarea>
                </div>

                <div id="edit-reason-container" class="hidden">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-amber-600 dark:text-amber-400 mb-1">Reason for Change (Audit Trail)</label>
                    <input type="text" id="tx-edit-reason" placeholder="Correction required due to..." class="w-full px-3 py-2 border border-amber-300 dark:border-amber-700 rounded-lg dark:bg-slate-900 text-sm focus:ring-2 focus:ring-amber-500">
                </div>

                <div class="pt-4 flex justify-end gap-3 border-t border-slate-200 dark:border-slate-700">
                    <button type="button" onclick="closeTransactionModal()" class="px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 text-sm font-semibold hover:bg-slate-100 dark:hover:bg-slate-700">Cancel</button>
                    <button type="submit" id="modal-submit-btn" class="px-5 py-2 rounded-lg text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 shadow-sm transition-all">Save Record</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MAIN APPLICATION SCRIPT -->
    <script>
        /**
         * ====================================================================
         * FINANCEHUB - MANAGEMENT ACCOUNTS & I&E SYSTEM ARCHITECTURE
         * ====================================================================
         */

        // APP STATE & DATABASE SIMULATION
        const STORAGE_KEYS = {
            TRANSACTIONS: 'fh_transactions_db',
            CATEGORIES: 'fh_categories_db',
            COMPANY: 'fh_company_settings',
            AUDIT: 'fh_audit_logs',
        };

        // Application State
        let state = {
            currentView: 'dashboard',
            period: 'this_month', // this_month, prev_month, this_quarter, this_year, prev_year, financial_year, all
            searchQuery: '',
            filterType: 'all', // all, income, expenditure
            filterCategory: 'all',
            company: {
                name: 'Acme Enterprises Ltd',
                currency: 'GBP',
                currencySymbol: '£',
                fyStartMonth: 4, // April (1-indexed)
                role: 'Finance Manager'
            },
            categories: [],
            transactions: [],
            auditLogs: []
        };

        // Default Categories Configuration
        const DEFAULT_CATEGORIES = [
            // Income
            { id: 'cat_inc_1', type: 'income', name: 'Sales & Client Revenue', active: true },
            { id: 'cat_inc_2', type: 'income', name: 'Service Income & Retainers', active: true },
            { id: 'cat_inc_3', type: 'income', name: 'Commission & Fees', active: true },
            { id: 'cat_inc_4', type: 'income', name: 'Rental Income', active: true },
            { id: 'cat_inc_5', type: 'income', name: 'Interest & Investment Return', active: true },
            { id: 'cat_inc_6', type: 'income', name: 'Other Income', active: true },
            // Expenditure
            { id: 'cat_exp_1', type: 'expenditure', name: 'Staff & Payroll Salaries', active: true },
            { id: 'cat_exp_2', type: 'expenditure', name: 'Rent & Office Premises', active: true },
            { id: 'cat_exp_3', type: 'expenditure', name: 'Utilities (Gas, Electric, Water)', active: true },
            { id: 'cat_exp_4', type: 'expenditure', name: 'Marketing & Advertising', active: true },
            { id: 'cat_exp_5', type: 'expenditure', name: 'Software, Hosting & IT Services', active: true },
            { id: 'cat_exp_6', type: 'expenditure', name: 'Accountancy & Legal Fees', active: true },
            { id: 'cat_exp_7', type: 'expenditure', name: 'Travel & Accommodation', active: true },
            { id: 'cat_exp_8', type: 'expenditure', name: 'Bank Charges & Merchant Fees', active: true },
            { id: 'cat_exp_9', type: 'expenditure', name: 'Insurance & Licenses', active: true },
            { id: 'cat_exp_10', type: 'expenditure', name: 'Office Supplies & Stationery', active: true },
            { id: 'cat_exp_11', type: 'expenditure', name: 'Miscellaneous Expense', active: true }
        ];

        // INITIALIZATION (No Dummy Data Default)
        function initApp() {
            loadStateFromStorage();
            updateCurrencyUI();
            lucide.createIcons();
            navigate('dashboard');
        }

        function loadStateFromStorage() {
            const storedComp = localStorage.getItem(STORAGE_KEYS.COMPANY);
            if (storedComp) state.company = JSON.parse(storedComp);

            const storedCats = localStorage.getItem(STORAGE_KEYS.CATEGORIES);
            state.categories = storedCats ? JSON.parse(storedCats) : [...DEFAULT_CATEGORIES];

            const storedTxs = localStorage.getItem(STORAGE_KEYS.TRANSACTIONS);
            state.transactions = storedTxs ? JSON.parse(storedTxs) : [];

            const storedAudit = localStorage.getItem(STORAGE_KEYS.AUDIT);
            state.auditLogs = storedAudit ? JSON.parse(storedAudit) : [];
        }

        function saveStateToStorage() {
            localStorage.setItem(STORAGE_KEYS.COMPANY, JSON.stringify(state.company));

        // FINANCIAL CALCULATIONS & ACCOUNTING LOGIC ENGINE
        function getFilteredTransactions(period = state.period) {
            let txs = state.transactions.filter(t => t.status === 'active');
            const now = new Date('2026-09-04'); // Current date context

            return txs.filter(t => {
                const txDate = new Date(t.date);
                if (isNaN(txDate)) return false;

                switch (period) {
                    case 'this_month':
                        return txDate.getMonth() === now.getMonth() && txDate.getFullYear() === now.getFullYear();
                    case 'prev_month': {
                        const prevM = new Date(now.getFullYear(), now.getMonth() - 1, 1);
                        return txDate.getMonth() === prevM.getMonth() && txDate.getFullYear() === prevM.getFullYear();
                    }
                    case 'this_quarter': {
                        const currentQuarter = Math.floor(now.getMonth() / 3);
                        const txQuarter = Math.floor(txDate.getMonth() / 3);
                        return currentQuarter === txQuarter && txDate.getFullYear() === now.getFullYear();
                    }
                    case 'this_year':
                        return txDate.getFullYear() === 2026;
                    case 'prev_year':
                        return txDate.getFullYear() === 2025;
                    case 'financial_year': {
                        // FY starting April 1st 2026 to March 31st 2027
                        const fyStart = new Date(2026, 3, 1);
                        const fyEnd = new Date(2027, 2, 31, 23, 59, 59);
                        return txDate >= fyStart && txDate <= fyEnd;
                    }
                    case 'all':
                    default:
                        return true;
                }
            });
        }

        function calculateFinancialSummary(period = state.period) {
            const txs = getFilteredTransactions(period);

            let totalIncome = 0;
            let totalExpenditure = 0;

            txs.forEach(t => {
                if (t.items && Array.isArray(t.items) && t.items.length > 0) {
                    const sum = t.items.reduce((acc, curr) => acc + (parseFloat(curr.amount) || 0), 0);
                    if (t.type === 'income') totalIncome += sum;
                    else if (t.type === 'expenditure') totalExpenditure += sum;
                } else {
                    const amt = parseFloat(t.amount) || 0;
                    if (t.type === 'income') totalIncome += amt;
                    else if (t.type === 'expenditure') totalExpenditure += amt;
                }
            });

            const netProfit = totalIncome - totalExpenditure;

            // Previous Period Comparison for Growth Rates
            let prevPeriod = 'prev_month';
            if (period === 'this_year') prevPeriod = 'prev_year';
            
            const prevTxs = getFilteredTransactions(prevPeriod);
            let prevIncome = 0;
            let prevExpenditure = 0;
            
            prevTxs.forEach(t => {
                if (t.items && Array.isArray(t.items) && t.items.length > 0) {
                    const sum = t.items.reduce((acc, curr) => acc + (parseFloat(curr.amount) || 0), 0);
                    if (t.type === 'income') prevIncome += sum;
                    else if (t.type === 'expenditure') prevExpenditure += sum;
                } else {
                    const amt = parseFloat(t.amount) || 0;
                    if (t.type === 'income') prevIncome += amt;
                    else if (t.type === 'expenditure') prevExpenditure += amt;
                }
            });

            const incomeGrowth = prevIncome > 0 ? ((totalIncome - prevIncome) / prevIncome) * 100 : 0;
            const expenseGrowth = prevExpenditure > 0 ? ((totalExpenditure - prevExpenditure) / prevExpenditure) * 100 : 0;

            return {
                totalIncome,
                totalExpenditure,
                netProfit,
                incomeGrowth,
                expenseGrowth,
                transactionCount: txs.length
            };
        }

        function getCategoryTotals(type, period = state.period) {
            const txs = getFilteredTransactions(period).filter(t => t.type === type);
            const totals = {};

            txs.forEach(t => {
                if (t.items && Array.isArray(t.items) && t.items.length > 0) {
                    t.items.forEach(item => {
                        totals[item.category_id] = (totals[item.category_id] || 0) + (parseFloat(item.amount) || 0);
                    });
                } else if (t.category_id) {
                    totals[t.category_id] = (totals[t.category_id] || 0) + (parseFloat(t.amount) || 0);
                }
            });

            return totals;
        }

        // UI HELPER FUNCTIONS & FORMATTERS
        function formatCurrency(amount) {
            const sym = state.company.currencySymbol || '£';
            const val = parseFloat(amount) || 0;
            return `${sym}${val.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d)) return dateStr;
            return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        function getCategoryName(catId) {
            const cat = state.categories.find(c => c.id === catId);
            return cat ? cat.name : 'Uncategorized';
        }

        function getTransactionCategoryLabel(t) {
            if (t.items && Array.isArray(t.items) && t.items.length > 0) {
                if (t.items.length === 1) {
                    return getCategoryName(t.items[0].category_id);
                }
                const names = t.items.map(i => getCategoryName(i.category_id));
                return `${t.items.length} Categories (${names.join(', ')})`;
            }
            return getCategoryName(t.category_id);
        }

        function saveTransaction(e) {
            e.preventDefault();

            if (selectedCategoryIds.size === 0) {
                showToast('Please select at least one category.', 'error');
                return;
            }

            const txId = document.getElementById('tx-id').value;
            const type = document.getElementById('tx-type').value;
            const scope = document.querySelector('input[name="tx-entry-scope"]:checked').value;

            let dateStr = '';
            if (scope === 'monthly') {
                const month = document.getElementById('tx-month').value;
                const year = document.getElementById('tx-year').value;
                dateStr = `${year}-${month}-01`;
            } else {
                dateStr = document.getElementById('tx-date').value;
            }

            // Build items array
            const items = [];
            let totalAmount = 0;

            selectedCategoryIds.forEach(catId => {
                const input = document.getElementById(`amt_input_${catId}`);
                const amt = input ? parseFloat(input.value) || 0 : 0;
                items.push({
                    category_id: catId,
                    amount: amt
                });
                totalAmount += amt;
            });

            if (totalAmount <= 0) {
                showToast('Please enter a valid amount greater than zero.', 'error');
                return;
            }

            const source = document.getElementById('tx-source').value;
            const payment_method = document.getElementById('tx-payment-method').value;
            const ref = document.getElementById('tx-reference').value;
            const attachment = document.getElementById('tx-attachment').value;
            const desc = document.getElementById('tx-description').value;

            if (txId) {
                // Edit existing transaction
                const index = state.transactions.findIndex(t => t.id === txId);
                if (index !== -1) {
                    const oldTx = state.transactions[index];
                    const editReason = document.getElementById('tx-edit-reason').value || 'Correction';
                    
                    state.transactions[index] = {
                        ...oldTx,
                        scope,
                        date: dateStr,
                        type,
                        amount: totalAmount,
                        items,
                        source,
                        payment_method,
                        ref,
                        attachment,
                        desc,
                        updated_at: new Date().toISOString()
                    };

                    logAudit('TRANSACTION_EDIT', `Updated ${type} entry #${txId}. Reason: ${editReason}`);
                    showToast('Transaction updated successfully', 'success');
                }
            } else {
                // Create new multi-category transaction
                const newTx = {
                    id: 'tx_' + Date.now(),
                    scope,
                    type,
                    date: dateStr,
                    amount: totalAmount,
                    items,
                    category_id: items[0].category_id, // Backward compatibility primary category
                    source,
                    payment_method,
                    ref,
                    attachment,
                    desc,
                    status: 'active',
                    created_at: new Date().toISOString()
                };

                state.transactions.unshift(newTx);
                logAudit('TRANSACTION_ADD', `Added new ${type} entry [${items.length} categories, Total: ${formatCurrency(totalAmount)}]`);
                showToast('Transaction saved successfully', 'success');
            }

            saveStateToStorage();
            closeTransactionModal();
            navigate(state.currentView);
        }

        function deleteTransaction(txId) {
            if (confirm('Are you sure you want to delete this transaction record?')) {
                const tx = state.transactions.find(t => t.id === txId);
                if (tx) {

                    showToast('Transaction record deleted', 'info');
                    navigate(state.currentView);
                }
            }
        }

        function initDashboardCharts() {
            const summary = calculateFinancialSummary();
            const expTotals = getCategoryTotals('expenditure');

            const ctx1 = document.getElementById('dashComparisonChart');
            if (ctx1) {
                new Chart(ctx1, {
                    type: 'bar',
                    data: {
                        labels: ['Income', 'Expenditure', 'Net Profit'],
                        datasets: [{
                            label: 'Amount (' + state.company.currencySymbol + ')',

                            backgroundColor: ['#16a34a', '#dc2626', '#0284c7'],
                            borderRadius: 8

                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } }
                    }
                });
            }

            // Pie/Doughnut Chart Category breakdown
            const ctx2 = document.getElementById('dashExpenseCategoryChart');
            if (ctx2) {
                const catLabels = [];
                const catData = [];
                
                Object.keys(expTotals).forEach(catId => {
                    catLabels.push(getCategoryName(catId));
                    catData.push(expTotals[catId]);
                });

                new Chart(ctx2, {
                    type: 'doughnut',
                    data: {
                        labels: catLabels.length > 0 ? catLabels : ['No Expenses'],
                        datasets: [{
                            data: catData.length > 0 ? catData : [1],
                            backgroundColor: ['#ef4444', '#f97316', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#64748b']
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { position: 'right' } }
                    }
                });
            }
        }

                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Company / Entity Name</label>
                            <input type="text" id="set-company-name" value="${state.company.name}" required class="w-full px-3 py-2 border rounded-lg dark:bg-slate-900 dark:border-slate-700 text-sm">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Currency Code</label>
                                <input type="text" id="set-currency" value="${state.company.currency}" required class="w-full px-3 py-2 border rounded-lg dark:bg-slate-900 dark:border-slate-700 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Currency Symbol</label>
                                <input type="text" id="set-symbol" value="${state.company.currencySymbol}" required class="w-full px-3 py-2 border rounded-lg dark:bg-slate-900 dark:border-slate-700 text-sm">
                            </div>
                        </div>
                        <button type="submit" class="px-5 py-2 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm rounded-lg shadow-sm">
                            Save Settings
                        </button>
                    </form>
                </div>
            `;
        }

        function saveSettings(e) {
            e.preventDefault();
            state.company.name = document.getElementById('set-company-name').value;
            state.company.currency = document.getElementById('set-currency').value;
            state.company.currencySymbol = document.getElementById('set-symbol').value;
            
            saveStateToStorage();
            updateCurrencyUI();
            logAudit('SETTINGS_UPDATE', 'Updated company profile parameters');
            showToast('Settings saved successfully', 'success');
        }

        // APPLICATION LAUNCH
        window.onload = initApp;
    </script>
</body>
</html>
